<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title>Portrait Gallery | At Home Pet Care</title>

  <meta
  name="description"
  content="Custom charcoal pet portraits and artwork by Claire."
  >

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
  <h1>Portrait Gallery</h1>
  <nav>
    <a href="index.html">Home</a>
  </nav>
</header>

<main class="gallery">
  <div class="container">

    <h2>Sample Work</h2>

   <div class="portrait-gallery">

        <img
            src="images/flower.jpg"
            alt="Charcoal flower drawing on black paper."
            class="gallery-side"
            loading="lazy"
            tabindex="0"
        >

        <img
            src="images/bear.jpg"
            alt="Charcoal bear drawing on black paper."
            class="gallery-main"
            loading="lazy"
            tabindex="0"
        >

        <img
            src="images/self.jpg"
            alt="Charcoal self-portrait drawing on black paper."
            class="gallery-side"
            loading="lazy"
            tabindex="0"
        >

    </div>

    <div class="gallery-caption">
        <p>
        These sample pieces showcase my drawing style, attention to detail, and realistic shading.
        </p>

        <p>
        Custom pet portraits are created from your favorite photos.
        </p>

        <p>
        Questions or custom requests? Reach out below.
        </p>

        <a class="contact-button" href="sms:+19104068365">
            Text Me
        </a>
    </div>
  </div>
</main>

<footer class="gallery-footer">
    <p>© At Home Pet Care</p>
</footer>

<div id="lightbox" class="lightbox">
  <img id="lightbox-img" src="" alt="">
</div>

<script src="js/script.js"></script>
</body>
</html>
